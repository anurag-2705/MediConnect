<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#167d72" />
  <title>MediConnect | Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf4ed; color: #172e34; font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
    main { max-width: 420px; }
    h1 { font-size: 1.6rem; margin: 0 0 10px; }
    p { margin: 0 0 20px; color: #4e6b66; line-height: 1.5; }
    .retry { display: inline-block; background: #167d72; color: #fff; border-radius: 10px; padding: 12px 20px; font-size: 1rem; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>You&rsquo;re offline</h1>
    <p>MediConnect needs an internet connection to show doctors, times and appointments. Check your connection and try again.</p>
    <a class="retry" href="/">Try again</a>
  </main>
</body>
</html>
